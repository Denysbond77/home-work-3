<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контакти</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <!-- Меню -->
    <nav>
      <ul>
        <li><a href="../index.html">Головна</a></li>
        <li><a href="about.html">Про сайт</a></li>
        <li><a href="articles.html">Статті</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="contacts.html">Контакти</a></li>
        <li><a href="top_movies.html">Топ фільми</a></li>
      </ul>
    </nav>

    <!-- Контент -->
    <div class="container">
      <h1>Контакти</h1>
      <p>Будь ласка, заповніть форму нижче для зв'язку з нами:</p>

      <form action="/submit_form" method="post">
        <!-- Блок: Особиста інформація -->
        <fieldset>
          <legend>Особиста інформація</legend>
          <label for="name">Ваше ім'я:</label>
          <input type="text" id="name" name="user_name" required />
          <label for="email">Електронна пошта:</label>
          <input type="email" id="email" name="user_email" required />
          <label for="phone">Телефон:</label>
          <input type="tel" id="phone" name="user_phone" />
        </fieldset>

        <!-- Блок: Ваші вподобання -->
        <fieldset>
          <legend>Ваші вподобання</legend>
          <label>Улюблений жанр:</label>
          <select name="favorite_genre" id="genre">
            <option value="action">Бойовик</option>
            <option value="comedy">Комедія</option>
            <option value="drama">Драма</option>
            <option value="sci-fi">Наукова фантастика</option>
            <option value="other">Інше</option>
          </select>
          <p>Оберіть ваші улюблені фільми:</p>
          <div class="checkbox-group">
            <label for="shawshank">Втеча з Шоушенка</label>
            <input
              type="checkbox"
              id="shawshank"
              name="favorite_movies"
              value="shawshank"
            />

            <label for="interstellar">Інтерстеллар</label>
            <input
              type="checkbox"
              id="interstellar"
              name="favorite_movies"
              value="interstellar"
            />

            <label for="lotr">Володар перснів</label>
            <input
              type="checkbox"
              id="lotr"
              name="favorite_movies"
              value="lotr"
            />
          </div>
        </fieldset>

        <!-- Блок: Ваше повідомлення -->
        <fieldset>
          <legend>Ваше повідомлення</legend>
          <label for="subject">Тема повідомлення:</label>
          <input type="text" id="subject" name="subject" />
          <label for="message">Ваше повідомлення:</label>
          <textarea
            id="message"
            name="user_message"
            rows="4"
            required
          ></textarea>
        </fieldset>

        <!-- Блок: Дії -->
        <fieldset>
          <legend>Дії</legend>
          <div class="actions">
            <div class="action-item">
              <label for="email_contact">
                Електронна пошта
                <input
                  type="radio"
                  id="email_contact"
                  name="contact_method"
                  value="email"
                  checked
                />
              </label>
            </div>
            <div class="action-item">
              <label for="phone_contact">
                Телефон
                <input
                  type="radio"
                  id="phone_contact"
                  name="contact_method"
                  value="phone"
                />
              </label>
            </div>
            <div class="action-item">
              <label for="no_contact">
                Не зв'язуватися
                <input
                  type="radio"
                  id="no_contact"
                  name="contact_method"
                  value="none"
                />
              </label>
            </div>
            <div class="action-buttons">
              <button type="submit">Надіслати</button>
              <button type="reset">Скинути</button>
            </div>
          </div>
        </fieldset>
      </form>
    </div>
    <footer>
      <p>&copy; 2025 Кіномани. Усі права захищено.</p>
    </footer>
  </body>
</html>
